<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#87b0d2">
  <meta name="description" content="Deserted Island — a first-person WebGPU beach for ThreeBrowser Runtime and the browser.">
  <title>Deserted Island — ThreeBrowser</title>
  <script type="importmap">
  {
    "imports": {
      "three": "./node_modules/three/build/three.webgpu.js",
      "three/webgpu": "./node_modules/three/build/three.webgpu.js",
      "three/tsl": "./node_modules/three/build/three.tsl.js",
      "three/addons/": "./node_modules/three/examples/jsm/"
    }
  }
  </script>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #87b0d2; }
    #boot {
      position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center;
      padding: 24px; color: #edf4fb;
      background: radial-gradient(circle at 50% 28%, #7fb3d6 0, #4a7fa8 42%, #2b4c63 100%);
      font-family: "Segoe UI", sans-serif;
    }
    .boot-card {
      width: min(560px, 100%); padding: 28px;
      border: 1px solid rgba(255,255,255,.22); border-radius: 16px;
      background: rgba(18, 42, 58, .88); box-shadow: 0 24px 80px rgba(0,0,0,.35);
    }
    .eyebrow { color: #9fe7ff; font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 8px 0 12px; font-size: clamp(26px, 5vw, 42px); line-height: 1.05; }
    #boot-status { color: #d5e6f0; line-height: 1.55; min-height: 1.55em; }
    #boot-detail { margin: 6px 0 0; color: #9fb8c6; font-size: 13px; min-height: 1.2em; }
    .meter-row { display: flex; align-items: center; gap: 12px; margin: 20px 0 0; }
    .meter { flex: 1; height: 6px; overflow: hidden; border-radius: 9px; background: #1c3c4e; }
    #boot-meter-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #7fd4ef, #e8fbff);
      transition: width 160ms ease-out;
    }
    #boot-percent { color: #9fe7ff; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; min-width: 3.2em; text-align: right; }
    #boot.is-leaving { opacity: 0; pointer-events: none; transition: opacity 420ms ease; }
    .error { color: #ffb3c4 !important; }
  </style>
</head>
<body>
  <div id="boot" role="status" aria-live="polite">
    <div class="boot-card">
      <div class="eyebrow">WebGPU</div>
      <h1>Deserted Island</h1>
      <p id="boot-status">Checking this browser and graphics adapter.</p>
      <p id="boot-detail"></p>
      <div class="meter-row">
        <div class="meter" id="boot-meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="boot-status">
          <div id="boot-meter-fill"></div>
        </div>
        <div id="boot-percent">0%</div>
      </div>
    </div>
  </div>
  <script type="module" src="./browser-entry.mjs"></script>
</body>
</html>
